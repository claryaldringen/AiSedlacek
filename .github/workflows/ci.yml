name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Validace jen čte repozitář – token nemá dostat právo zápisu.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Akce pinované na commit SHA (tag lze přesunout); komentář = odpovídající tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # npm ci spouští install skripty závislostí – token v .git/config nenechávat.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck/lint/test závisí na ^build → packages/db build = prisma generate
      - run: npx turbo typecheck lint format:check test

      # Chyby, které odhalí jen `next build` (hranice server/client, Suspense,
      # neplatné exporty rout), by na produkci shodily web až po smazání .next.
      # Build potřebuje jen syntakticky platné hodnoty – k DB se nepřipojuje.
      - run: npx turbo build --filter=@ai-sedlacek/web
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
          AUTH_SECRET: ci-build-only
          NEXTAUTH_URL: http://localhost:3003
